name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  checks:
    name: Lint, typecheck, test, build, integration, e2e
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      AI_PROVIDER: mock
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Local Supabase (Docker is available on GitHub-hosted Ubuntu runners).
      # Applies supabase/migrations and supabase/config.toml. Started first
      # because next.config.ts validates the env (typecheck runs next typegen).
      - name: Start Supabase
        run: npm run db:start
      - name: Export Supabase env
        run: npm run --silent db:env >> "$GITHUB_ENV"
      # Same steps and order as `npm run verify` (scripts/verify.sh); gitleaks
      # runs in the secret-scan job. Keep the two in sync.
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Design-token contrast
        run: npm run check:contrast
      - name: Integration tests (Supabase local)
        run: npm run test:int
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (mock AI, Supabase local)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
